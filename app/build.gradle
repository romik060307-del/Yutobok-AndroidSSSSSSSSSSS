plugins { id 'com.android.application' }

android {
    namespace 'com.rkdesign.rkcamera'
    compileSdk 35
    defaultConfig {
        applicationId 'com.rkdesign.rkcamera'
        minSdk 26
        targetSdk 28
        versionCode 8
        versionName '2.2'
        // Android phones use ARM ABIs; omit emulator-only x86 libraries to reduce APK size.
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'androidx.camera:camera-video:1.4.2'
    implementation 'androidx.media3:media3-common:1.5.1'
    implementation 'androidx.media3:media3-effect:1.5.1'
    implementation 'androidx.media3:media3-transformer:1.5.1'
    implementation 'org.opencv:opencv:4.10.0'
    // Offline, on-device neural segmentation for person/portrait background blur.
    implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta6'
}
